<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 SDK 디버깅</title>
</head>
<body>
    <h1>카카오 SDK 디버깅 페이지</h1>
    <button id="test-btn">카카오 SDK 테스트</button>
    <div id="log"></div>

    <!-- 카카오 SDK 로드 -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"
            integrity="sha384-TiCUE00h649CAMonG018J2ujOgDKW/kVBaj0Fe1LWJwfOi9GdHXqT2RgmN7FUWIo"
            crossorigin="anonymous"></script>

    <script>
        function log(message) {
            console.log(message);
            document.getElementById('log').innerHTML += '<p>' + message + '</p>';
        }

        document.addEventListener('DOMContentLoaded', function() {
            log('DOM loaded');
            log('Kakao object exists: ' + (typeof Kakao !== 'undefined'));
            
            if (typeof Kakao !== 'undefined') {
                // 실제 .env 파일의 키
                const kakaoKey = 'ba78641b7e0d4a613a879b8a78acc20e';
                log('Kakao Key length: ' + kakaoKey.length);
                
                try {
                    if (Kakao.isInitialized()) {
                        log('Kakao already initialized, cleaning up...');
                        Kakao.cleanup();
                    }
                    
                    log('Initializing Kakao SDK...');
                    Kakao.init(kakaoKey);
                    log('Kakao SDK initialized: ' + Kakao.isInitialized());
                    
                    // 공유 테스트
                    document.getElementById('test-btn').addEventListener('click', function() {
                        log('Testing Kakao Share...');
                        if (Kakao.isInitialized()) {
                            Kakao.Share.sendDefault({
                                objectType: 'text',
                                text: '테스트 메시지입니다.',
                                link: {
                                    mobileWebUrl: 'http://127.0.0.1:8001',
                                    webUrl: 'http://127.0.0.1:8001'
                                }
                            });
                        } else {
                            log('Kakao SDK not initialized');
                        }
                    });
                    
                } catch (error) {
                    log('Kakao SDK initialization failed: ' + error.message);
                }
            } else {
                log('Kakao SDK not loaded');
            }
        });
    </script>
</body>
</html>
