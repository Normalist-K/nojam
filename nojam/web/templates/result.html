{% extends "base.html" %}

{% block title %}심리테스트 결과{% endblock %}

{% block content %}
  <h1 class="text-2xl font-bold mb-4 text-center">당신의 결과는</h1>

  <!-- 결과 카드 이미지 -->
  <div class="mb-6">
    <img src="/static/cards/{{ result_type }}.jpg" alt="결과 카드" class="w-full rounded shadow" />
  </div>

  <!-- 광고 슬롯 (AdSense Stub) -->
  <div id="adsense-slot" class="border border-dashed border-gray-400 h-28 flex items-center justify-center mb-6">
    광고 영역 (Stub)
  </div>

  <!-- 답변 JSON (디버그용) -->
  <details class="mb-4">
    <summary class="cursor-pointer text-sm text-gray-600">선택한 답 보기</summary>
    <pre class="bg-gray-100 p-2 rounded text-xs">{{ answers | tojson(indent=2) }}</pre>
  </details>

  <!-- 카카오 공유 버튼 -->
  <button id="share-btn" class="bg-yellow-400 px-6 py-3 rounded font-semibold">카카오톡 공유</button>
  <script>
    document.getElementById('share-btn').addEventListener('click', () => {
      fetch('/stub/kakao/share').then(() => alert('공유 완료 (stub)!'));
    });
  </script>
{% endblock %}
