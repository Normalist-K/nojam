<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>심리테스트 – 질문</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-4 max-w-xl mx-auto">
  <h1 class="text-2xl font-bold mb-4">심리테스트</h1>
  <form method="post" action="/submit" class="space-y-4">
    {% for i in range(1,11) %}
    <div>
      <label class="block font-medium mb-1">문항 {{ i }}</label>
      <select name="q{{ i }}" required class="border p-2 w-full">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>
    </div>
    {% endfor %}
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">제출</button>
  </form>
</body>
</html>
