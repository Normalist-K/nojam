<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}심리테스트{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9967830345918971"
     crossorigin="anonymous"></script>
  
  <!-- Kakao JavaScript SDK -->
  <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
  
  <!-- 페이지별 추가 헤더 -->
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-gray-50 flex flex-col">
  <header class="bg-blue-600 text-white py-3 font-semibold text-center">
    <a href="/" class="hover:text-blue-200 transition-colors">심리테스트</a>
  </header>
  <main class="flex-1 container mx-auto p-4 max-w-xl">
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center text-sm text-gray-500 py-4">
    © 2025 마음나이 테스트
  </footer>

  <!-- Kakao SDK 초기화 -->
  <script>
    // Kakao SDK 초기화
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded, checking Kakao SDK...');
      console.log('Kakao object exists:', typeof Kakao !== 'undefined');
      console.log('Current URL:', window.location.href);
      
      if (typeof Kakao !== 'undefined') {
        const kakaoKey = '{{ kakao_javascript_key|default("your-kakao-key-here") }}';
        console.log('Kakao Key (첫 20자):', kakaoKey.substring(0, 20) + '...');
        console.log('Kakao Key length:', kakaoKey.length);
        
        if (kakaoKey && kakaoKey !== 'your-kakao-key-here' && kakaoKey.length > 10) {
          try {
            // 이미 초기화된 경우 재초기화
            if (Kakao.isInitialized()) {
              console.log('Kakao already initialized, cleaning up...');
              Kakao.cleanup();
            }
            
            console.log('Initializing Kakao SDK...');
            Kakao.init(kakaoKey);
            console.log('Kakao SDK initialized successfully:', Kakao.isInitialized());
            
            // 초기화 후 잠시 대기
            setTimeout(() => {
              console.log('Final Kakao initialization check:', Kakao.isInitialized());
            }, 100);
            
          } catch (error) {
            console.error('Kakao SDK initialization failed:', error);
            console.error('Error details:', error.message);
          }
        } else {
          console.warn('Kakao JavaScript Key not configured or invalid');
          console.warn('Key details:', {
            exists: !!kakaoKey,
            notDefault: kakaoKey !== 'your-kakao-key-here',
            length: kakaoKey ? kakaoKey.length : 0
          });
        }
      } else {
        console.error('Kakao SDK is not loaded');
        console.error('Check if kakao.min.js is properly loaded');
      }
    });
  </script>
</body>
</html>
