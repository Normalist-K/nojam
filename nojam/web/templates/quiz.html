{% extends "base.html" %}

{% block title %}심리테스트 – 질문{% endblock %}

{% block content %}
  <h1 class="text-2xl font-bold mb-6 text-center">10문항 심리테스트</h1>
  <form method="post" action="/submit" class="space-y-6">
    {% for i in range(1,11) %}
    <div class="border rounded p-3 bg-white shadow">
      <label class="block font-medium mb-2">문항 {{ i }}</label>
      <select name="q{{ i }}" required class="border p-2 w-full rounded">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>
    </div>
    {% endfor %}
    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded font-semibold">결과 보기</button>
  </form>
{% endblock %}
